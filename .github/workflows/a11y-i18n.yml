name: Accessibility & i18n checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  a11y-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Build
        run: |
          cd client
          npm run build
      - name: Start server
        run: |
          cd client
          npm run start &
          echo "Waiting for server..." && sleep 10
      - name: Run axe-core scan
        run: |
          npx @axe-core/cli http://localhost:3000 --save report-axe.json || true
      - name: Run i18n validator
        run: |
          node ./scripts/i18n-validate.js
